<!DOCTYPE html>
<HTML>
	<HEAD>
		<TITLE>ログイン</TITLE>

		<META NAME="viewport" CONTENT="width=device-width, initial-scale=1.0">

		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/reset.css">
		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/DEFAULT.css">
		<LINK REL="stylesheet" HREF="https://cdn.rumia.me/CSS/font.css">

		<STYLE>
			:root{
				--PLATE_WIDHT: calc(100vw - (50px * 2));
				--PLATE_HEIGHT: 200px;
			}
			
			body{
				width: 100vw;
				height: 100vh;

				background: var(--RSV_DEFAULT_BG);
			}

			.PLATE{
				display: flex;
				flex-direction: column;

				position: fixed;
				top: calc(50vh - (var(--PLATE_HEIGHT) / 2));
				left: 50px;

				width: var(--PLATE_WIDHT);
				height: var(--PLATE_HEIGHT);
			}

			.PLATE > div{
				height: calc(var(--PLATE_HEIGHT) / 2);
			}

			.PLATE > .ERROR{
				color: red;
			}

			.PLATE > button{
				margin-top: 20px;
			}
		</STYLE>
	</HEAD>
	<BODY>
		<DIV CLASS="PLATE">
			<DIV>ログイン</DIV>
			<DIV CLASS="ERROR" ID="ERROR"></DIV>
			<INPUT TYPE="text" ID="TEXT_BOX" PLACEHOLDER="お待ちください。">
			<BUTTON ID="NEXT_BUTTON">次へ</BUTTON>
		</DIV>
	</BODY>
	<SCRIPT>
		const redirect_table = {
			"ilanes": "https://ilanes.rumiserver.com/",
			"ilanes_admin": "https://ilanes.rumiserver.com/admin/",
			"storage": "https://storage.rumiserver.com/",
			"rumichat": "https://chat.rumiserver.com/",
			"welcome": "https://account.rumiserver.com/welcome"
		};

		let mel = {
			text_box: document.getElementById("TEXT_BOX"),
			error: document.getElementById("ERROR"),
			next_button: document.getElementById("NEXT_BUTTON")
		};
		let user_id = null;
		let password = null;
		let totp = null;

		window.addEventListener("load", function() {
			//PCか？
			const ua_check = /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
			const touch_check = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth <= 768;
			if (!(ua_check || touch_check)) {
				window.location.href = "index.html";
				return;
			}

			init();
		});

		/**
		 * 初期化
		*/
		function init() {
			user_id = null;
			password = null;
			totp = null;

			change_prompt("ユーザーID");
			mel.text_box.name = "username";
			mel.next_button.onclick = function() {
				userid_done();
			};
		}
	
		/**
		 * ユーザーIDを入力後
		*/
		function userid_done() {
			if (mel.text_box.value == "") return;
			user_id = mel.text_box.value;

			change_prompt("パスワード");
			mel.text_box.type = "password";
			mel.text_box.name = "password";
			mel.next_button.onclick = function() {
				password_done();
			};
		}

		/**
		 * パスワード入力後
		*/
		function password_done() {
			if (mel.text_box.value == "") return;
			password = mel.text_box.value;
			login();
		}

		async function login() {
			change_prompt("お待ちください。");
			mel.text_box.type = "text";
			mel.text_box.name = "wait";
			mel.next_button.onclick = null;
			mel.next_button.disabled = true;

			//APIへログイン要請
			let ajax = await fetch("https://account.rumiserver.com/api/Session", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"Accept": "application/json"
				},
				body: JSON.stringify({
					"UID": user_id,
					"PASS": password,
					"TOTP": totp
				})
			});
			const result = await ajax.json();

			if (result.STATUS == false) {
				mel.error.innerHTML = `ログイン失敗！<A HREF="/login_issue/">もう無理だ</A>`;
				init();
				return;
			}

			//追加の認証情報
			if (result.SESSION_ID == null) {
				switch (result.REQUEST) {
					case "TOTP": {
						change_prompt("二段階認証");
						mel.next_button.disabled = false;
						mel.next_button.onclick = function(e) {
							totp = mel.text_box.value;
							login();
						};
						return;
					}
				}
			}

			//クッキーにセッションを登録
			let cookie_date = new Date();
			cookie_date.setTime(cookie_date.getTime() + 400 * 24 * 60 * 60 * 1000);
			document.cookie = `SESSION=${result.SESSION_ID}; path=/; domain=rumiserver.com; expires=${cookie_date.toUTCString()}; Secure; SameSite=Lax`;

			//リダイレクトする
			const redirect_select = new URLSearchParams(window.location.search).get("rd");
			if (redirect_select == null) {
				window.location.href = "/";
			} else {
				if (redirect_table[redirect_select] != null) {
					window.location.href = redirect_table[redirect_select];
				} else {
					window.location.href = redirect_select;
				}
			}
		}

		function change_prompt(placeholder) {
			mel.text_box.placeholder = placeholder;
			mel.text_box.value = "";
		}
	</SCRIPT>
</HTML>
